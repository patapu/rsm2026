version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-site
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - FINGERPRINT_SECRET=${FINGERPRINT_SECRET}
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-20}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:3000}
    volumes:
      - ./prompts:/app/prompts:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - resume-net

  redis:
    image: redis:7-alpine
    container_name: resume-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - resume-net

volumes:
  redis-data:

networks:
  resume-net:
    driver: bridge
